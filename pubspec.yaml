name: smart_media_recovery

description: Smart Media Recovery & File Rescue

publish_to: "none"


version: 1.0.0+1


environment:
  sdk: ^3.12.0



dependencies:

  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8


  provider: ^6.1.5


  permission_handler: ^12.0.1


  photo_manager: ^3.7.1


  path_provider: ^2.1.5


  share_plus: ^10.1.4


  open_filex: ^4.7.0


  device_info_plus: ^11.5.0


  hive: ^2.2.3

  hive_flutter: ^1.1.0


  shared_preferences: ^2.5.3


  video_thumbnail_plus: ^0.0.2





dev_dependencies:


  flutter_test:

    sdk: flutter


  flutter_lints: ^6.0.0


  flutter_launcher_icons: ^0.14.4





flutter:


  uses-material-design: true



  assets:

    - assets/images/

    - assets/icons/

    - assets/animations/





flutter_launcher_icons:

  android: true

  ios: true

  image_path: "assets/images/app_logo.png"

  adaptive_icon_background: "#0D6EFD"

  adaptive_icon_foreground: "assets/images/app_logo.png"
